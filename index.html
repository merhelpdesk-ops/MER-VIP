<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER VIP Fee Structure & Portal</title>
    
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <style>
        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(18, 24, 38, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --brand-primary: #0066ff;
            --brand-cyan: #00f2fe;
            --brand-glow: rgba(0, 102, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #8da0bf;
            --text-muted: #576b8a;
            --negative-green: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(0, 102, 255, 0.22) 0%, transparent 50%),
                radial-gradient(circle at 90% 60%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部官方 Navbar */
        .navbar {
            width: 100%;
            height: 64px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(7, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, var(--brand-cyan));
            -webkit-background-clip: text;
