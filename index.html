<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER VIP FEE STRUCTURE</title>
    
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <style>
        :root {
            --bg-color: #070913;
            --card-bg: rgba(16, 24, 45, 0.65);
            --border-color: rgba(64, 150, 255, 0.18);
            --border-hover: rgba(0, 229, 255, 0.45);
            --primary-blue: #0088ff;
            --accent-cyan: #00f2fe;
            --glow-color: rgba(0, 136, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #8ea8c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 136, 255, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 顶部大标题栏 - 增加霓虹渐变字与科技底线 */
        .header {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 12px;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 20%, #4da3ff 60%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 10px 20px rgba(0, 136, 255, 0.2);
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* 暗黑科技感玻璃拟态卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 48px rgba(0, 136, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .card:hover::before {
            left: 100%;
        }

        /* 标题样式升级 - 呼吸灯条与微光特效 */
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #d8e5f8;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--primary-blue));
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* 图片容器与圆角优化 */
        .img-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(0, 0, 0, 0.2);
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        }

        /* 可点击 Banner 悬停放大与微亮反光 */
        a.clickable-banner {
            display: block;
            text-decoration: none;
            position: relative;
        }

        a.clickable-banner:hover img {
            transform: scale(1.015);
            filter: brightness(1.08);
            cursor: pointer;
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5d78;
            margin-top: 12px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* Mobile Tawk Widget Styles (悬浮按钮美化) */
        #mobile-tawk-widget {
            display: none;
        }

        .tawk-mobile-native-hidden iframe[src="about:blank"][referrerpolicy="no-referrer-when-downgrade"][style*="max-width:124px"] {
            transform: translateX(200vw) !important;
            -webkit-transform: translateX(200vw) !important;
        }

        #mobile-tawk-widget.is-visible {
            align-items: center;
            background: linear-gradient(135deg, #0088ff 0%, #00f2fe 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            bottom: calc(76px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 8px 24px rgba(0, 136, 255, 0.5);
            color: #fff;
            cursor: grab;
            display: flex;
            height: 52px;
            justify-content: center;
            padding: 0;
            position: fixed;
            right: 20px;
            touch-action: none;
            user-select: none;
            width: 52px;
            z-index: 2000000001;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #mobile-tawk-widget.is-visible:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.6);
        }

        #mobile-tawk-widget.is-dragging {
            cursor: grabbing;
            transform: scale(0.95);
        }

        @media (min-width: 1001px) {
            #mobile-tawk-widget.is-visible {
                bottom: 32px;
                right: 28px;
            }
        }
    </style>

    <script type="text/javascript">
        var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
        var mobileTawkPositionKey = 'merdex-mobile-tawk-position';
        Tawk_API.autoStart = false;
        document.documentElement.classList.add('tawk-mobile-native-hidden');

        function isMobileTawkScreen() {
            return true;
        }

        function getMobileTawkWidget() {
            return document.getElementById('mobile-tawk-widget');
        }

        function showMobileTawkWidget(visible) {
            var widget = getMobileTawkWidget();
            if (widget) widget.classList.toggle('is-visible', visible && isMobileTawkScreen());
        }

        function hideNativeMobileTawkWidget(hidden) {
            document.documentElement.classList.toggle(
                'tawk-mobile-native-hidden',
                hidden && isMobileTawkScreen()
            );
        }

        function clampMobileTawkWidget() {
            var widget = getMobileTawkWidget();
            if (!widget || !widget.classList.contains('is-visible')) return;
            var rect = widget.getBoundingClientRect();
            var left = Math.max(0, Math.min(rect.left, window.innerWidth - rect.width));
            var top = Math.max(0, Math.min(rect.top, window.innerHeight - rect.height));
            widget.style.left = left + 'px';
            widget.style.top = top + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
        }

        function restoreMobileTawkPosition() {
            var widget = getMobileTawkWidget();
            if (!widget) return;
            try {
                var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
                if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
                    widget.style.left = position.left + 'px';
                    widget.style.top = position.top + 'px';
                    widget.style.right = 'auto';
                    widget.style.bottom = 'auto';
                }
            } catch (error) { }
            requestAnimationFrame(clampMobileTawkWidget);
        }

        function syncMobileTawkWidget() {
            if (typeof Tawk_API.showWidget !== 'function') return;
            if (!isMobileTawkScreen()) {
                hideNativeMobileTawkWidget(false);
                showMobileTawkWidget(false);
                if (typeof Tawk_API.start === 'function') Tawk_API.start({ showWidget: true });
                Tawk_API.showWidget();
                return;
            }
            var maximized = typeof Tawk_API.isChatMaximized === 'function' && Tawk_API.isChatMaximized();
            if (maximized) {
                hideNativeMobileTawkWidget(false);
                showMobileTawkWidget(false);
                Tawk_API.showWidget();
            } else {
                hideNativeMobileTawkWidget(true);
                Tawk_API.hideWidget();
                showMobileTawkWidget(true);
                restoreMobileTawkPosition();
            }
        }

        function openMobileTawkChat() {
            showMobileTawkWidget(false);
            hideNativeMobileTawkWidget(false);
            if (typeof Tawk_API.start === 'function') Tawk_API.start({ showWidget: true });
            if (typeof Tawk_API.showWidget === 'function') Tawk_API.showWidget();
            if (typeof Tawk_API.maximize === 'function') Tawk_API.maximize();
        }

        function openTawkChat() {
            openMobileTawkChat();
        }

        Tawk_API.onLoad = syncMobileTawkWidget;
        Tawk_API.onChatMaximized = function () {
            hideNativeMobileTawkWidget(false);
            showMobileTawkWidget(false);
        };
        Tawk_API.onChatMinimized = function () {
            if (isMobileTawkScreen()) {
                hideNativeMobileTawkWidget(true);
                Tawk_API.hideWidget();
                showMobileTawkWidget(true);
                restoreMobileTawkPosition();
            }
        };
        Tawk_API.onChatHidden = function () {
            if (isMobileTawkScreen()) {
                hideNativeMobileTawkWidget(true);
                showMobileTawkWidget(true);
                restoreMobileTawkPosition();
            }
        };

        window.addEventListener('resize', syncMobileTawkWidget);

        document.addEventListener('DOMContentLoaded', function () {
            var widget = getMobileTawkWidget();
            var drag = null;

            if (!widget) return;

            if (isMobileTawkScreen()) {
                showMobileTawkWidget(true);
                restoreMobileTawkPosition();
            }

            widget.addEventListener('pointerdown', function (event) {
                var rect = widget.getBoundingClientRect();
                drag = {
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    startLeft: rect.left,
                    startTop: rect.top,
                    moved: false
                };
                widget.setPointerCapture(event.pointerId);
                widget.classList.add('is-dragging');
                event.preventDefault();
            });

            widget.addEventListener('pointermove', function (event) {
                if (!drag || drag.pointerId !== event.pointerId) return;
                var deltaX = event.clientX - drag.startX;
                var deltaY = event.clientY - drag.startY;
                if (Math.hypot(deltaX, deltaY) > 5) drag.moved = true;
                var left = Math.max(0, Math.min(drag.startLeft + deltaX, window.innerWidth - widget.offsetWidth));
                var top = Math.max(0, Math.min(drag.startTop + deltaY, window.innerHeight - widget.offsetHeight));
                widget.style.left = left + 'px';
                widget.style.top = top + 'px';
                widget.style.right = 'auto';
                widget.style.bottom = 'auto';
            });

            widget.addEventListener('pointerup', function (event) {
                if (!drag || drag.pointerId !== event.pointerId) return;
                widget.releasePointerCapture(event.pointerId);
                widget.classList.remove('is-dragging');
                if (drag.moved) {
                    try {
                        localStorage.setItem(mobileTawkPositionKey, JSON.stringify({
                            left: widget.offsetLeft,
                            top: widget.offsetTop
                        }));
                    } catch (error) { }
                } else {
                    openMobileTawkChat();
                }
                drag = null;
            });

            widget.addEventListener('pointercancel', function () {
                widget.classList.remove('is-dragging');
                drag = null;
            });

            widget.addEventListener('click', function (event) {
                if (event.detail === 0) openMobileTawkChat();
            });
        });

        (function () {
            var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
            s1.async = true;
            s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
            s1.charset = 'UTF-8';
            s1.setAttribute('crossorigin', '*');
            s0.parentNode.insertBefore(s1, s0);
        })();
    </script>
    </head>
<body>

    <div class="container">
        <div class="header">
            <h1>MER VIP FEE STRUCTURE</h1>
            <p>Official VIP Level & Fee Rate Details</p>
        </div>

        <div class="card">
            <div class="card-title">VIP 专属客服通道 (中文)</div>

        <div class="card">

        <div class="card">

        </div>

        <div class="footer">
            © MER VIP Finance. All rights reserved.
        </div>
    </div>

    <button id="mobile-tawk-widget" type="button" aria-label="Chat widget" title="Chat widget"
        class="tawk-custom-color tawk-custom-border-color tawk-outline tawk-button tawk-button-circle tawk-button-large">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" height="32" width="32" role="img"

        </svg>
    </button>

</body>
