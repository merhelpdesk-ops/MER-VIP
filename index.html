<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER VIP FEE STRUCTURE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 顶部大标题栏 */
        .header {
            text-align: center;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #4da3ff;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #8a99ad;
        }

        /* 暗黑科技感卡片容器 */
        .card {
            background: linear-gradient(180deg, #131b2e 0%, #0d1424 100%);
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: #2b457a;
        }

        /* 标题边条与字号 */
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #64b5f6;
            margin-bottom: 14px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: #0088ff;
            border-radius: 2px;
        }

        /* 图片样式与悬停效果 */
        .img-container {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        /* 可点击卡片加 hover 变亮反馈 */
        a.clickable-banner {
            display: block;
            text-decoration: none;
        }

        a.clickable-banner:hover img {
            opacity: 0.95;
            transform: scale(1.01);
            cursor: pointer;
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a70;
            margin-top: 16px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 页头大标题 -->
        <div class="header">
            <h1>MER VIP FEE STRUCTURE</h1>
            <p>Official VIP Level & Fee Rate Details</p>
        </div>

        <!-- 1. 中文服务 Banner (点击直接跳转 X/Twitter) -->
        <div class="card">
            <div class="card-title">VIP 专属客服通道 (中文)</div>
            <a href="https://x.com/merhelpdesk?s=11" target="_blank" rel="noopener noreferrer" class="clickable-banner">
                <div class="img-container">
                    <img src="./MERVIPServiceChinese.JPG" alt="MER VIP 客服通道 中文">
                </div>
            </a>
        </div>

        <!-- 2. 中文费率表卡片 -->
        <div class="card">
            <div class="card-title">中文版费率表</div>
            <div class="img-container">
                <img src="./MER-VIP-Chinese.JPG" alt="MER VIP 费率表 中文">
            </div>
        </div>

        <!-- 3. 英文服务 Banner (点击直接跳转 X/Twitter) -->
        <div class="card">
            <div class="card-title">VIP Service Portal (English)</div>
            <a href="https://x.com/merhelpdesk?s=11" target="_blank" rel="noopener noreferrer" class="clickable-banner">
                <div class="img-container">
                    <img src="./MERVIPServiceEnglish.JPG" alt="MER VIP Service English">
                </div>
            </a>
        </div>

        <!-- 4. 英文费率表卡片 -->
        <div class="card">
            <div class="card-title">English Version</div>
            <div class="img-container">
                <img src="./MER-VIP-English.JPG" alt="MER VIP Fee Structure English">
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            © MER VIP Finance. All rights reserved.
        </div>
    </div>

</body>
</html>
