<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MER VIP Fee Structure</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.7);
      --border-color: rgba(56, 139, 253, 0.25);
      --accent-color: #58a6ff;
      --glow-color: rgba(56, 139, 253, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 139, 253, 0.12), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08), transparent 40%);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #8b949e;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 139, 253, 0.5);
      box-shadow: 0 12px 40px 0 var(--glow-color);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent-color);
      border-radius: 2px;
    }

    .img-wrapper {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #161b22;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #484f58;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">MER VIP FEE STRUCTURE</h1>
    <p class="subtitle">Official VIP Level & Fee Rate Details</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">中文版费率表</div>
      <div class="img-wrapper">
        <img src="./MER-VIP-Chinese.JPG" alt="MER VIP 费率表 (中文)">
      </div>
    </div>

    <div class="card">
      <div class="card-title">English Version</div>
      <div class="img-wrapper">
        <img src="./MER-VIP-English.JPG" alt="MER VIP Fee Structure (English)">
      </div>
    </div>
  </div>

  <footer>
    &copy; MER VIP Finance. All rights reserved.
  </footer>

</body>
</html>
