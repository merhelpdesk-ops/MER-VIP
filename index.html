<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MER VIP FEE STRUCTURE</title>
    
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <style>
        :root {
            --bg-main: #0a0d18;
            --card-bg: #111726;
            --card-border: #1d273d;
            --brand-cyan: #00f2fe;
            --brand-blue: #0077ff;
            --text-primary: #ffffff;
            --text-muted: #8292ab;
            --green-accent: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部官方 Navigation */
        .header-bar {
            width: 100%;
            height: 56px;
            background-color: #0e1322;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .brand-badge {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-cyan));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
        }

        .chat-top-btn {
            background: linear-gradient(135deg, var(--brand-blue), #0055cc);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 主内容容器 */
        .container {
            width: 100%;
            max-width: 720px;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 标题 Banner */
        .hero {
            text-align: center;
            padding: 10px 0 4px;
        }

        .hero h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hero p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* 语言切换器 Tab */
        .tab-box {
            display: flex;
            background: #0f1524;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 3px;
        }

            flex: 1;
            text-align: center;
