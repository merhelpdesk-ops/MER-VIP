<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MER VIP FEE STRUCTURE</title>
    
    <!-- Favicon -->
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <!-- Google Fonts Inter with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #06080d;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(59, 130, 246, 0.4);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-glow: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 40%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 32px 16px 24px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 顶部 Header */
        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 8px #3b82f6;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 玻璃拟态 Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 16px 32px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 20px var(--glass-glow);
        }

        /* 标题栏 */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .title-indicator {
            width: 3px;
            height: 14px;
            background: linear-gradient(180deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 2px;
        }

        .action-hint {
            font-size: 12px;
            color: var(--accent-blue);
            font-weight: 500;
        }

        /* 图片容器 */
        .img-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        a.clickable-banner {
            display: block;
            text-decoration: none;
        }

        a.clickable-banner:hover img {
            transform: scale(1.01);
            opacity: 0.95;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #475569;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        /* 悬浮客服按钮 */
        #mobile-tawk-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            right: 16px;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2563eb, #0891b2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            color: #fff;
            cursor: pointer;
            z-index: 99999;
            touch-action: none;
            user-select: none;
        }

        #mobile-tawk-widget.is-dragging {
            opacity: 0.9;
            transform: scale(0.95);
        }
    </style>

    <!-- Tawk.to Script -->
    <script type="text/javascript">
        var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
        var mobileTawkPositionKey = 'merdex-mobile-tawk-position';

        function openTawkChat() {
            if (typeof Tawk_API.maximize === 'function') {
                Tawk_API.maximize();
            } else if (typeof Tawk_API.toggle === 'function') {
                Tawk_API.toggle();
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var widget = document.getElementById('mobile-tawk-widget');
            var drag = null;
            if (!widget) return;

            // 恢复悬浮球位置
            try {
                var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
                if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
                    widget.style.left = position.left + 'px';
                    widget.style.top = position.top + 'px';
                    widget.style.right = 'auto';
                    widget.style.bottom = 'auto';
                }
            } catch (e) { }

            widget.addEventListener('pointerdown', function (event) {
                var rect = widget.getBoundingClientRect();
                drag = {
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    startLeft: rect.left,
                    startTop: rect.top,
                    moved: false
                };
                widget.setPointerCapture(event.pointerId);
                widget.classList.add('is-dragging');
                event.preventDefault();
            });

            widget.addEventListener('pointermove', function (event) {
                if (!drag || drag.pointerId !== event.pointerId) return;
                var deltaX = event.clientX - drag.startX;
                var deltaY = event.clientY - drag.startY;
                if (Math.hypot(deltaX, deltaY) > 5) drag.moved = true;
                var left = Math.max(0, Math.min(drag.startLeft + deltaX, window.innerWidth - widget.offsetWidth));
                var top = Math.max(0, Math.min(drag.startTop + deltaY, window.innerHeight - widget.offsetHeight));
                widget.style.left = left + 'px';
                widget.style.top = top + 'px';
                widget.style.right = 'auto';
                widget.style.bottom = 'auto';
            });

            widget.addEventListener('pointerup', function (event) {
                if (!drag || drag.pointerId !== event.pointerId) return;
                widget.releasePointerCapture(event.pointerId);
                widget.classList.remove('is-dragging');
                if (drag.moved) {
                    try {
                        localStorage.setItem(mobileTawkPositionKey, JSON.stringify({
                            left: widget.offsetLeft,
                            top: widget.offsetTop
                        }));
                    } catch (e) { }
                } else {
                    openTawkChat();
                }
                drag = null;
            });

            widget.addEventListener('pointercancel', function () {
                widget.classList.remove('is-dragging');
                drag = null;
            });
        });

        (function () {
            var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
            s1.async = true;
            s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
            s1.charset = 'UTF-8';
            s1.setAttribute('crossorigin', '*');
            s0.parentNode.insertBefore(s1, s0);
        })();
    </script>
</head>
