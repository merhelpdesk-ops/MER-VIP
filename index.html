<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MER VIP FEE STRUCTURE</title>
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <style>
        :root {
            --bg-main: #0a0d18;
            --card-bg: #111726;
            --card-border: #1d273d;
            --brand-cyan: #00f2fe;
            --brand-blue: #0077ff;
            --text-primary: #ffffff;
            --text-muted: #8292ab;
            --green-accent: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部导航 */
        .header-bar {
            width: 100%;
            height: 54px;
            background-color: #0e1322;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .brand-badge {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, var(--brand-blue), var(--brand-cyan));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
            color: #fff;
        }

        .chat-top-btn {
            background: var(--brand-blue);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 主内容 */
        .container {
            width: 100%;
            max-width: 720px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hero {
            text-align: center;
            padding: 8px 0;
        }

        .hero h1 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .hero p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 语言 Tab */
        .tab-box {
            display: flex;
            background: #0f1524;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 2px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
        }

        .tab-item.active {
            background: var(--brand-blue);
            color: #ffffff;
        }

        /* 卡片 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
        }

        .card-header {
            font-size: 14px;
            font-weight: 700;
            color: #d1e0f7;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-header::before {
            content: "";
            width: 3px;
            height: 12px;
            background-color: var(--brand-cyan);
            border-radius: 2px;
        }

        /* 专属客服入口 */
        .banner-btn-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #131d33 0%, #172440 100%);
            border: 1px solid #23355c;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
        }
