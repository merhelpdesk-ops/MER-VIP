<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MER VIP FEE STRUCTURE</title>
    
    <link rel="icon" href="./favicon.webp" type="image/webp" />

    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(13, 18, 36, 0.65);
            --card-border: rgba(0, 242, 254, 0.18);
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 顶部科技感背景霓虹光晕 */
        body::before {
            content: '';
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(79, 172, 254, 0.08) 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* 赛博网格底纹 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            position: relative;
            z-index: 1;
        }

        /* 顶部大标题栏 */
        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #4facfe 50%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            drop-shadow: 0 10px 30px rgba(0, 242, 254, 0.3);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* 玻璃拟态科技卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.8), transparent);
            transition: 0.6s ease-in-out;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            border-color: rgba(0, 242, 254, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 242, 254, 0.2);
        }

        /* 标题边条与字号 */
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary-accent);
        }

        /* 图片容器 */
        .img-container {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            transition: all 0.4s ease;
        }

        /* 可点击 Banner 反馈 */
        a.clickable-banner {
            display: block;
            text-decoration: none;
            position: relative;
        }

        a.clickable-banner:hover img {
            transform: scale(1.02);
            filter: brightness(1.08);
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #484f58;
            margin-top: 20px;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        /* Mobile Tawk Widget Styles */
        #mobile-tawk-widget {
            display: none;
        }

        .tawk-mobile-native-hidden iframe {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 保持原有结构，补全缺失的闭合标签与数据 -->
        <header class="header">
            <h1>MER VIP FEE STRUCTURE</h1>
            <p>EXCLUSIVE TIERED PRIVILEGE SYSTEM</p>
        </header>

        <main class="card">
            <div class="card-title">VIP MEMBER PRIVILEGES</div>
            <a href="#" class="clickable-banner">
                <div class="img-container">
                    <img src="./favicon.webp" alt="MER VIP Fee Structure" />
                </div>
            </a>
        </main>

        <footer class="footer">
            © 2026 MER VIP SYSTEM · ALL RIGHTS RESERVED
        </footer>
    </div>

</body>
</html>
