    <style id="tawk-anti-flicker-style">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 24px;
        }

        body:not(.tawk-chat-open) iframe[src*="tawk.to"],
        body:not(.tawk-chat-open) iframe[title*="chat"],
        body:not(.tawk-chat-open) div[id^="tawk"],
        body:not(.tawk-chat-open) div[class*="tawk"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translate3d(-9999px, -9999px, 0) !important;
        }

        body.tawk-chat-open iframe[src*="tawk.to"],
        body.tawk-chat-open iframe[title*="chat"] {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            transform: none !important;
        }

        .top-navbar {
            width: 100%;
            height: 60px;
            background: #0d1322;
            border-bottom: 1px solid #1e2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .brand-logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 24px 16px 0 16px;
        }

        .header {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #4da3ff;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #8a99ad;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn-nav {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: linear-gradient(180deg, #182642 0%, #0f192e 100%);
            border: 1px solid #0088ff;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0, 136, 255, 0.15);
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            background: linear-gradient(180deg, #0088ff 0%, #0055b3 100%);
            border-color: #4da3ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 255, 0.3);
        }

        .btn-nav:active {
            transform: translateY(0);
        }

        .card {
            background: linear-gradient(180deg, #131b2e 0%, #0d1424 100%);
            border: 1px solid #1e2d4a;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: #2b457a;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #64b5f6;
            margin-bottom: 14px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: #0088ff;
            border-radius: 2px;
        }

        .img-container {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        a.clickable-banner {
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        a.clickable-banner:hover img {
            opacity: 0.95;
            transform: scale(1.01);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #4a5a70;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
          div[role="dialog"] {
            margin-bottom: calc(72px + env(safe-area-inset-bottom, 0px)) !important;
            max-height: calc(100vh - 120px) !important;
            max-width: 94vw !important;
            box-sizing: border-box !important;
          }

          div[role="dialog"] > div {
            max-height: calc(100vh - 140px) !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            box-sizing: border-box !important;
          }

          div[role="dialog"] * {
            max-width: 100% !important;
            box-sizing: border-box !important;
            word-break: break-word !important;
          }

          div[role="dialog"] div[style*="width"] {
            width: 100% !important;
            min-width: 0 !important;
          }
        }

        #mobile-tawk-widget {
            display: none;
        }

        #mobile-tawk-widget.is-visible {
            align-items: center;
            background: #1595ad;
            border: 0;
            border-radius: 50%;
            bottom: calc(76px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 5px 18px rgba(21, 149, 173, 0.4);
            color: #fff;
            cursor: grab;
            display: flex;
            height: 44px;
            justify-content: center;
            padding: 0;
            position: fixed;
            right: 16px;
            touch-action: none;
            user-select: none;
            width: 44px;
            z-index: 2000000001;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        #mobile-tawk-widget.is-dragging {
            cursor: grabbing;
            transform: scale(0.96);
        }

        @media (min-width: 1001px) {
            #mobile-tawk-widget.is-visible {
                bottom: 30px;
                right: 20px;
            }
        }

    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      Tawk_API.lang = 'en';

      var mobileTawkPositionKey = 'merdex-mobile-tawk-position';
      var tawkReady = false;

      function getMobileTawkWidget() {
        return document.getElementById('mobile-tawk-widget');
      }

      function showMobileTawkWidget(visible) {
        var widget = getMobileTawkWidget();
        if (widget) widget.classList.toggle('is-visible', visible);
      }

      function clampMobileTawkWidget() {
        var widget = getMobileTawkWidget();
        if (!widget || !widget.classList.contains('is-visible')) return;
        var rect = widget.getBoundingClientRect();
        var left = Math.max(0, Math.min(rect.left, window.innerWidth - rect.width));
        var top = Math.max(0, Math.min(rect.top, window.innerHeight - rect.height));
        widget.style.left = left + 'px';
        widget.style.top = top + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
      }

      function restoreMobileTawkPosition() {
        var widget = getMobileTawkWidget();
        if (!widget) return;
        try {
          var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
          if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
            widget.style.left = position.left + 'px';
            widget.style.top = position.top + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
          }
        } catch (error) { }
        requestAnimationFrame(clampMobileTawkWidget);
      }

      function backToCustomBubble() {
        document.body.classList.remove('tawk-chat-open');
        showMobileTawkWidget(true);
        restoreMobileTawkPosition();

        try {
          if (typeof Tawk_API.hideWidget === 'function') {
            Tawk_API.hideWidget();
          }
        } catch (e) {}
      }

      function openMobileTawkChat() {
        if (!tawkReady) {
          setTimeout(function () {
            if (tawkReady) openMobileTawkChat();
          }, 300);
          return;
        }

        document.body.classList.add('tawk-chat-open');
        showMobileTawkWidget(false);

        try {
          if (typeof Tawk_API.showWidget === 'function') Tawk_API.showWidget();
          if (typeof Tawk_API.start === 'function') Tawk_API.start();
          if (typeof Tawk_API.maximize === 'function') Tawk_API.maximize();
          else if (typeof Tawk_API.toggle === 'function') Tawk_API.toggle();
        } catch (e) {}

        setTimeout(function () {
          try {
            if (typeof Tawk_API.isChatMaximized === 'function'
                && !Tawk_API.isChatMaximized()
                && typeof Tawk_API.toggle === 'function') {
              Tawk_API.toggle();
            }
          } catch (e) {}
        }, 400);
      }

      function openTawkChat() {
        openMobileTawkChat();
      }

      Tawk_API.onLoad = function () {
        tawkReady = true;
        if (typeof Tawk_API.isChatMaximized === 'function' && Tawk_API.isChatMaximized()) {
          document.body.classList.add('tawk-chat-open');
          showMobileTawkWidget(false);
          if (typeof Tawk_API.showWidget === 'function') Tawk_API.showWidget();
        } else {
          backToCustomBubble();
        }
      };

      Tawk_API.onChatMaximized = function () {
        document.body.classList.add('tawk-chat-open');
        showMobileTawkWidget(false);
      };

      Tawk_API.onChatMinimized = backToCustomBubble;
      Tawk_API.onChatHidden = backToCustomBubble;

      window.addEventListener('resize', clampMobileTawkWidget);

      document.addEventListener('DOMContentLoaded', function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        if (s0 && s0.parentNode) {
          s0.parentNode.insertBefore(s1, s0);
        } else {
          document.head.appendChild(s1);
        }

        var widget = getMobileTawkWidget();
        var drag = null;

        if (!widget) return;

        showMobileTawkWidget(true);
        restoreMobileTawkPosition();

        widget.addEventListener('pointerdown', function (event) {
          var rect = widget.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            moved: false
          };
          widget.setPointerCapture(event.pointerId);
          widget.classList.add('is-dragging');
        });

        widget.addEventListener('pointermove', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          var deltaX = event.clientX - drag.startX;
          var deltaY = event.clientY - drag.startY;
          if (Math.hypot(deltaX, deltaY) > 5) drag.moved = true;
          var left = Math.max(0, Math.min(drag.startLeft + deltaX, window.innerWidth - widget.offsetWidth));
          var top = Math.max(0, Math.min(drag.startTop + deltaY, window.innerHeight - widget.offsetHeight));
          widget.style.left = left + 'px';
          widget.style.top = top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        });

        widget.addEventListener('pointerup', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          widget.releasePointerCapture(event.pointerId);
          widget.classList.remove('is-dragging');
          if (drag.moved) {
            try {
              localStorage.setItem(mobileTawkPositionKey, JSON.stringify({
                left: widget.offsetLeft,
                top: widget.offsetTop
              }));
            } catch (error) { }
          } else {
            openMobileTawkChat();
          }
          drag = null;
        });

        widget.addEventListener('pointercancel', function () {
          widget.classList.remove('is-dragging');
          drag = null;
        });
      });
    </script>
